ktor:
  deployment:
    # "$PORT:8080" = взять переменную окружения PORT, иначе 8080 (удобно в Docker)
    port: "$PORT:8080"
    host: "0.0.0.0"
    shutdownGracePeriod: 1000
    shutdownTimeout: 5000
  application:
    modules:
      - com.example.taskapi.ApplicationKt.module

app:
  version: "2.0.0"

# JWT: секрет можно переопределить переменной JWT_SECRET
jwt:
  secret: "$JWT_SECRET:ktor-task-api-dev-secret-change-me-in-production"
  issuer: "ktor-task-api"
  audience: "ktor-task-api-users"
  realm: "ktor-task-api"
  expiresInSeconds: "3600"
